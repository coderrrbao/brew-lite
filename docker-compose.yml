services:
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - '3000:3000'
    environment:
      INTERNAL_API_URL: http://backend:4000
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - '4000:4000'
    environment:
      PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      # DATABASE_URL: postgresql://brewlite:brewlite@db:5432/brewlite
      # JWT_SECRET: change-me
