services:
  frontend:
    image: ${FRONTEND_IMAGE:-brewlite-frontend}:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - '3000:3000'
    environment:
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:4000}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-brewlite-backend}:${IMAGE_TAG:-latest}
    build: ./backend
    ports:
      - '4000:4000'
    environment:
      PORT: ${PORT:-4000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://brewlite:brewlite@db:5432/brewlite?schema=public}
      # JWT_SECRET: change-me
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/products').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brewlite
      POSTGRES_PASSWORD: brewlite
      POSTGRES_DB: brewlite
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U brewlite -d brewlite']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
