name: BrewLite CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  feature-ci:
    name: Feature branch validation
    if: github.event_name == 'pull_request' || github.ref_name != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite
          POSTGRES_DB: brew_lite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brewlite -d brew_lite_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://brewlite:brewlite@localhost:5432/brew_lite_test?schema=public
      JWT_SECRET: ci-only-secret-do-not-use-in-production

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: backend
        run: pnpm db:generate

      - name: Apply database migrations
        working-directory: backend
        run: pnpm exec prisma migrate deploy

      - name: Backend lint
        working-directory: backend
        run: pnpm lint

      - name: Feature unit and integration tests
        working-directory: backend
        env:
          FEATURE_MODULE: ${{ startsWith(github.head_ref || github.ref_name, 'feature/') && (github.head_ref || github.ref_name) || '' }}
        run: |
          case "$FEATURE_MODULE" in
            feature/auth*) pnpm test:feature auth ;;
            feature/orders*) pnpm test:feature orders ;;
            feature/payments*) pnpm test:feature payments ;;
            feature/products*) pnpm test:feature products ;;
            feature/promotions*) pnpm test:feature promotions ;;
            *) pnpm test ;;
          esac

      - name: Feature TODO gate
        working-directory: backend
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          case "$BRANCH_NAME" in
            feature/auth*) pnpm test:todos auth --strict ;;
            feature/orders*) pnpm test:todos orders --strict ;;
            feature/payments*) pnpm test:todos payments --strict ;;
            feature/products*) pnpm test:todos products --strict ;;
            feature/promotions*) pnpm test:todos promotions --strict ;;
            *) pnpm test:todos ;;
          esac

      - name: Backend build
        working-directory: backend
        run: pnpm build

  main-integration-ci:
    name: Main integration validation
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite
          POSTGRES_DB: brew_lite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brewlite -d brew_lite_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://brewlite:brewlite@localhost:5432/brew_lite_test?schema=public
      JWT_SECRET: ci-only-secret-do-not-use-in-production

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        working-directory: backend
        run: pnpm db:generate
      - name: Apply database migrations
        working-directory: backend
        run: pnpm exec prisma migrate deploy
      - name: Backend lint and tests
        working-directory: backend
        run: |
          pnpm lint
          pnpm test
          pnpm test:todos
          pnpm build

      # TODO: Uncomment manually after all feature branches are merged.
      # - name: API E2E tests
      #   working-directory: backend
      #   run: pnpm test:e2e
