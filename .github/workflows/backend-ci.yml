name: Backend CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  feature-ci:
    name: Feature PR CI
    if: github.event_name == 'pull_request' || github.ref_name != 'main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: ci-only-secret-do-not-use-in-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Backend lint
        run: pnpm lint

      - name: Mock-based unit tests
        run: pnpm test -- --runInBand auth/auth.service.spec.ts products/products.service.spec.ts

      - name: Backend build
        run: pnpm build

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend type check
        working-directory: frontend
        run: pnpm lint

      - name: Frontend build
        working-directory: frontend
        run: pnpm build

  main-integration-ci:
    name: Main integration and E2E
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite
          POSTGRES_DB: brew_lite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brewlite -d brew_lite_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://brewlite:brewlite@localhost:5432/brew_lite_test?schema=public
      JWT_SECRET: ci-only-secret-do-not-use-in-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply database migrations
        run: pnpm exec prisma migrate deploy

      - name: Backend lint
        run: pnpm lint

      - name: All service and integration tests
        run: pnpm test -- --runInBand

      - name: API end-to-end test
        run: pnpm test:e2e

      - name: Backend build
        run: pnpm build

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend type check
        working-directory: frontend
        run: pnpm lint

      - name: Frontend build
        working-directory: frontend
        run: pnpm build
