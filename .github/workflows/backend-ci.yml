name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite
          POSTGRES_DB: brew_lite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brewlite -d brew_lite_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/brewlite
      JWT_SECRET: ci-only-secret-do-not-use-in-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply database migrations
        run: pnpm exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://brewlite:brewlite@localhost:5432/brew_lite_test?schema=public

      - name: Lint
        run: pnpm lint

      - name: Service database integration tests
        run: pnpm test -- --runInBand
        env:
          DATABASE_URL: postgresql://brewlite:brewlite@localhost:5432/brew_lite_test?schema=public

      - name: API end-to-end test
        run: pnpm test:e2e
        env:
          DATABASE_URL: postgresql://brewlite:brewlite@localhost:5432/brew_lite_test?schema=public

      - name: Build
        run: pnpm build
