name: BrewLite CD (Deploy to Production)

on:
  push:
    branches: ['main']

permissions:
  contents: read

jobs:
  backend-checks:
    name: Backend quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: BrewLite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: rm -f package-lock.json && npm install

      - name: Generate Prisma client
        working-directory: backend
        run: npm run db:generate

      - name: Push DB Schema
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/BrewLite_test?schema=public"
        run: npx prisma db push

      - name: Seed Database
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/BrewLite_test?schema=public"
        run: npm run db:seed

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Unit & Integration tests
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/BrewLite_test?schema=public"
        run: npm test

      - name: Build
        working-directory: backend
        run: npm run build


  frontend-checks:
    name: Frontend quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: rm -f package-lock.json && npm install

      - name: Type check & Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  # 3. Job Deploy (Chỉ chạy khi 2 job trên PASS)
  deploy:
    name: Deploy to Supabase, Render & Vercel
    needs: [backend-checks, frontend-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: rm -f package-lock.json && npm install

      # Bước 3.1: Chạy Prisma Migration lên Supabase thật
      - name: Run Prisma Migration (Supabase DB)
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: npx prisma migrate deploy

      # Bước 3.2: Trigger Render Deploy Backend
      - name: Trigger Render Deploy (Backend)
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      # Bước 3.3: Triển khai Frontend lên Vercel
      - name: Deploy Frontend to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: '--prod'

      # Bước 3.4: Smoke test kiểm tra trạng thái dịch vụ sau khi deploy
      - name: Smoke Test APIs
        run: |
          sleep 20
          curl -f ${{ secrets.RENDER_BACKEND_URL }}/products