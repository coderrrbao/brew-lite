name: BrewLite CD (Deploy to Cloud)

on:
  push:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  backend-checks:
    name: Backend quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: BrewLite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npm run db:generate

      - name: Push schema to test database
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/BrewLite_test?schema=public"
          DIRECT_URL: "postgresql://postgres:password@localhost:5432/BrewLite_test?schema=public"
        run: npx prisma db push

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://postgres:password@localhost:5432/BrewLite_test?schema=public"
          DIRECT_URL: "postgresql://postgres:password@localhost:5432/BrewLite_test?schema=public"
        run: npm test

  frontend-checks:
    name: Frontend quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy production
    needs: [backend-checks, frontend-checks]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Trigger Render backend deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Smoke test production
        run: |
          echo "Waiting 45 seconds for Render to start and run database migrations..."
          sleep 45
          curl -fsS "${{ secrets.RENDER_BACKEND_URL }}/products" > /dev/null
          curl -fsS "${{ secrets.VERCEL_FRONTEND_URL }}" > /dev/null
          echo "Smoke tests passed."

      - name: Deployment failure guidance
        if: failure()
        run: |
          echo "::error::Deployment failed. Review the logs above."
          echo "::warning::Roll back from the Vercel or Render dashboard if needed."
