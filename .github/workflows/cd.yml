name: BrewLite CD (Deploy to Cloud)

on:
  push:
    branches: ['main']

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Bước 1: Quality Gates
  backend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd backend && npm ci && npm run test

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd frontend && npm ci && npm run build

  # Bước 2: Deploy tự động
  deploy:
    needs: [backend-checks, frontend-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 2.1 Safe Database Migration lên Supabase
      - name: Run Prisma Migration on Supabase DB
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        run: npx prisma migrate deploy

      # 2.2 Trigger Render Deploy Backend
      - name: Trigger Render Deploy (Backend)
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      # 2.3 Deploy Frontend lên Vercel
      - name: Deploy Frontend to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./frontend
          vercel-args: '--prod'
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.RENDER_BACKEND_URL }}

      # 2.4 Smoke Test sau triển khai (Cả Backend & Frontend)
      - name: Smoke Test Production Health
        run: |
          sleep 25
          echo "Checking Backend Render..."
          curl -fsS ${{ secrets.RENDER_BACKEND_URL }}/products > /dev/null
          echo "Checking Frontend Vercel..."
          curl -fsS ${{ secrets.VERCEL_FRONTEND_URL }} > /dev/null

      # 2.5 Rollback / Failure Alert
      - name: Deployment Failure Handler
        if: failure()
        run: |
          echo "::error::Deploy failed! Check logs and use Vercel/Render Instant Rollback if needed."