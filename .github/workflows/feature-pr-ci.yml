name: BrewLite CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Monorepo Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite
          POSTGRES_DB: brew_lite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brewlite -d brew_lite_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://brewlite:brewlite@localhost:5432/brew_lite_test?schema=public
      JWT_SECRET: ci-only-secret-do-not-use-in-production
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: backend
        run: pnpm db:generate

      - name: Apply database migrations
        working-directory: backend
        run: pnpm exec prisma migrate deploy

      - name: Backend lint
        working-directory: backend
        run: pnpm lint

      - name: Backend feature tests
        working-directory: backend
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          case "$BRANCH_NAME" in
            feature/auth*) pnpm test:feature auth ;;
            feature/orders*) pnpm test:feature orders ;;
            feature/payments*) pnpm test:feature payments ;;
            feature/products*) pnpm test:feature products ;;
            feature/promotions*) pnpm test:feature promotions ;;
            *) pnpm test -- --runInBand ;;
          esac

      - name: Feature TODO status
        working-directory: backend
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          case "$BRANCH_NAME" in
            feature/auth*) pnpm test:todos auth --strict ;;
            feature/orders*) pnpm test:todos orders --strict ;;
            feature/payments*) pnpm test:todos payments --strict ;;
            feature/products*) pnpm test:todos products --strict ;;
            feature/promotions*) pnpm test:todos promotions --strict ;;
            *) pnpm test:todos ;;
          esac

      - name: Backend build
        working-directory: backend
        run: pnpm build

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend type check
        working-directory: frontend
        run: pnpm lint

      - name: Frontend tests
        working-directory: frontend
        run: pnpm test

      - name: Frontend TODO status
        working-directory: frontend
        run: pnpm test:todos

      - name: Frontend build
        working-directory: frontend
        run: pnpm build
