name: BrewLite Full Integration

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - integration
      - release-candidate
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  full-integration:
    name: Full unit and integration validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: brewlite
          POSTGRES_PASSWORD: brewlite
          POSTGRES_DB: brew_lite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brewlite -d brew_lite_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://brewlite:brewlite@localhost:5432/brew_lite_test?schema=public
      JWT_SECRET: ci-only-secret-do-not-use-in-production
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      - name: Install backend dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Prepare database
        working-directory: backend
        run: |
          pnpm db:generate
          pnpm exec prisma migrate deploy

      - name: Backend lint, unit/integration tests and build
        working-directory: backend
        run: |
          pnpm lint
          pnpm test -- --runInBand
          pnpm build

      # TODO: After all feature branches are merged, uncomment this step and
      # run the workflow manually to validate the complete API flow.
      # - name: Backend E2E tests
      #   working-directory: backend
      #   run: pnpm test:e2e

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Frontend type check, tests and build
        working-directory: frontend
        run: |
          pnpm lint
          pnpm test
          pnpm test:todos
          pnpm build
