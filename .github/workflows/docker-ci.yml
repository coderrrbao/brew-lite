name: BrewLite Docker CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/brewlite-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/brewlite-frontend

jobs:
  docker-build-and-test:
    name: Build & Test Docker Stack
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          load: true
          tags: ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          load: true
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:4000
          tags: ${{ env.FRONTEND_IMAGE }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Start Compose & Verify Healthchecks
        env:
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}
          IMAGE_TAG: latest
          JWT_SECRET: ci-test-secret-key
        run: |
          docker compose up -d db
          sleep 5
          docker compose run --rm backend npx prisma migrate deploy
          docker compose up -d --wait

          docker compose ps
          curl -f http://localhost:4000/products
          curl -f http://localhost:3000

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Clean up containers
        if: always()
        run: docker compose down -v